# ============================================
# CONFIGURACIÓN DE DESARROLLO
# ============================================

# MongoDB - Valor por defecto para desarrollo local
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/listochef}
spring.data.mongodb.database=ListOChef

# JWT Secret - Valor por defecto para desarrollo (NO usar en producción)
jwt.secret=${JWT_SECRET}

# Cloudinary - Valores por defecto para desarrollo
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:demo-cloud}
cloudinary.api-key=${CLOUDINARY_API_KEY:123456789}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:demo-secret}

# Logging muy detallado
logging.level.com.listochef=INFO
logging.level.org.springframework.web=WARN
logging.level.org.mongodb.driver=WARN
logging.level.org.springframework.security=WARN

# Formato de logs en consola
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# DevTools - reinicio automático
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# Mostrar stack traces completos
server.error.include-stacktrace=always
server.error.include-message=always
server.error.include-binding-errors=always

# Puerto de desarrollo
server.port=8080