# ============================================
# CONFIGURACIÓN BASE - ListOChef
# ============================================

# Nombre de la aplicación
spring.application.name=ListOChef

# JWT - Configuración común
jwt.expiration=86400000

# JWT Secret - DEBE venir de variable de entorno
jwt.secret=${JWT_SECRET:L0sBlAcki$YPi$tach0Va(n)ASacarUn1o!}

# MongoDB - DEBE venir de variable de entorno
spring.data.mongodb.uri=${MONGODB_URI}

# Cloudinary (si lo usas)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Perfil activo por defecto (sobrescribible por variable de entorno)
spring.profiles.active=${SPRING_PROFILE:dev}

# Tamaño máximo de archivos (si subes imágenes)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB